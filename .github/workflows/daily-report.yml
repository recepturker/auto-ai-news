name: Daily AI Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore --configuration Release

      - name: Generate report
        run: dotnet run --project src/AutoAiNews/AutoAiNews.csproj --configuration Release --no-restore -- --output daily-report.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT_DATE="$(TZ=Europe/Istanbul date +%F)"
          TAG="daily-ai-report-${REPORT_DATE}"
          TITLE="Daily AI Report - ${REPORT_DATE}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file daily-report.md --latest
          else
            gh release create "${TAG}" --title "${TITLE}" --notes-file daily-report.md --target "${GITHUB_SHA}" --latest
          fi
